server:
  port: 8082

spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:postgresql://localhost:5432/oda_db
    username: oda_user
    password: oda_password
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by database/schema.sql, not by this app
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: info
