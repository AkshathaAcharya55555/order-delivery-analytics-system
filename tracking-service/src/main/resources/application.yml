server:
  port: 8083

spring:
  application:
    name: tracking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/oda_db
    username: oda_user
    password: oda_password
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by database/schema.sql, not by this app
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: tracking-service-group
      auto-offset-reset: earliest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    org.hibernate.SQL: info
