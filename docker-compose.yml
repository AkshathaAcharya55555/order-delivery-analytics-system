services:
  postgres:
    image: postgres:16-alpine
    container_name: oda_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-oda_db}
      POSTGRES_USER: ${POSTGRES_USER:-oda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oda_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - oda_pg_data:/var/lib/postgresql/data
      # Auto-provisioned ONLY on a brand-new (empty) volume - the Postgres
      # image runs everything under docker-entrypoint-initdb.d, in name
      # order, the first time it starts. Mounted with numbered target names
      # so schema -> indexes -> views -> seed run in the right order without
      # renaming the actual source files (single source of truth preserved).
      # staging_schema.sql / load_generated_dataset.sql are NOT included here
      # - loading the full ~100k-order synthetic dataset stays the separate,
      # documented manual step described in the root README.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ./database/views.sql:/docker-entrypoint-initdb.d/03_views.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/04_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oda_user} -d ${POSTGRES_DB:-oda_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: oda_kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      # Containers on the compose network (order/delivery/tracking-service,
      # below) connect via PLAINTEXT://kafka:19092; a Spring Boot app run
      # directly on the host instead connects via EXTERNAL://localhost:9092.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "oda-kafka-cluster-1"
    healthcheck:
      # the check script launches its own JVM each run, which routinely takes
      # >10s on this machine even though the broker itself responds instantly
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092"]
      interval: 15s
      timeout: 30s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oda_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  order-service:
    build:
      context: ./order-service
    container_name: oda_order_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-oda_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-oda_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-oda_password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "${ORDER_SERVICE_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Observed cold-start time for this JVM under load: 100-183s (Spring
      # context init + Hikari + Kafka/Redis client setup); 45s was too tight
      # and caused false "unhealthy" flapping during startup.
      start_period: 210s

  delivery-service:
    build:
      context: ./delivery-service
    container_name: oda_delivery_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-oda_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-oda_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-oda_password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "${DELIVERY_SERVICE_PORT:-8082}:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 210s

  tracking-service:
    build:
      context: ./tracking-service
    container_name: oda_tracking_service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-oda_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-oda_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-oda_password}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "${TRACKING_SERVICE_PORT:-8083}:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 210s

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: oda_dashboard
    environment:
      ODA_DB_HOST: postgres
      ODA_DB_PORT: 5432
      ODA_DB_NAME: ${POSTGRES_DB:-oda_db}
      ODA_DB_USER: ${POSTGRES_USER:-oda_user}
      ODA_DB_PASSWORD: ${POSTGRES_PASSWORD:-oda_password}
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  oda_pg_data:

# order-service/delivery-service/tracking-service/dashboard can also still be
# run directly on the host (`mvn spring-boot:run`, `streamlit run dashboard/app.py`)
# instead of via this file - their application.yml / lib/data.py defaults are
# unchanged and still point at localhost, unaffected by the env vars set here.
